<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
		<script>
			// Applies the stored theme before first paint, so a dark-mode reader never
			// sees a white flash. Must be inline and must run before the CSS paints,
			// which is why the storage key is duplicated from theme.svelte.ts.
			try {
				var stored = localStorage.getItem('bumblebeing:theme');
				var dark =
					stored === 'dark' ||
					(!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
				if (dark) document.documentElement.classList.add('dark');
			} catch (e) {
				/* storage blocked; light theme is the default */
			}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
